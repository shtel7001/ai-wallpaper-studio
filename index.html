<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Wallpaper Studio</title><style>
:root{font-family:system-ui,sans-serif;color:#edf1ff;background:#101426}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:960px;margin:auto}h1{font-size:clamp(26px,6vw,42px)}p{line-height:1.6;color:#c8d2ee}.panel{background:#1d2540;border:1px solid #3b496e;border-radius:20px;padding:20px;margin:18px 0}label{display:block;margin:12px 0 7px}textarea,select,input,button{font:inherit;border-radius:10px;padding:12px;width:100%}textarea,select,input{background:#101a32;color:white;border:1px solid #536388}button{background:#a28aff;color:#100e25;font-weight:700;border:0;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}canvas{width:min(100%,360px);display:block;margin:16px auto;border-radius:16px}small{color:#b6c4e8}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}</style></head><body><main>
<h1>✨ AI Wallpaper Studio</h1><p>이미지 생성 API 없이 휴대폰에서 배경화면을 만들어 보세요. AI 모드는 실험적이며 지원되는 WebGPU 기기에서만 실행됩니다.</p>
<section class="panel"><h2>배경화면 설정</h2><label for="prompt">원하는 배경화면 설명</label><textarea id="prompt" rows="3">보라색 은하수와 빛나는 별이 있는 밤하늘</textarea><div class="row"><div><label for="size">화면 크기</label><select id="size"><option value="1440x3120">갤럭시 고화질 (1440×3120)</option><option value="1170x2532">아이폰 (1170×2532)</option><option value="1080x2400">일반 스마트폰 (1080×2400)</option></select></div><div><label for="theme">무료 배경 스타일</label><select id="theme"><option value="galaxy">은하수</option><option value="sunset">노을</option><option value="forest">숲</option><option value="ocean">바다</option></select></div></div>
<label for="photo">내 사진 업로드 (선택)</label><input id="photo" type="file" accept="image/*"><label for="overlay">사진 위 색상 효과</label><select id="overlay"><option value="none">없음</option><option value="purple">보라색</option><option value="blue">하늘색</option></select><button id="make">무료 배경화면 만들기</button><p id="recommendation" aria-live="polite"></p><button id="save">PNG 다운로드</button><button id="saveJpg">JPG 다운로드</button></section>
<section class="panel"><h2>미리보기</h2><canvas id="canvas" width="1080" height="2400"></canvas><small id="status" role="status">준비 완료</small></section>
<section class="panel"><h2>휴대폰 AI 생성 (실험 준비)</h2><p>WebGPU 지원 여부를 검사합니다. 실제 텍스트→이미지 모델은 아직 탑재되지 않았습니다. 이 버전의 ‘만들기’는 AI 생성이 아닌 로컬 그래픽 배경 제작입니다.</p><button id="gpu">WebGPU 지원 확인</button><p id="gpuStatus"></p><button id="diagnose">기기 AI 실행 적합성 검사</button><button id="computeTest">실제 GPU 연산 테스트</button><button id="memoryTest">GPU 메모리·연산 부하 테스트 (16MiB)</button><p id="memoryResult" role="status"></p><p id="computeResult" role="status"></p><button id="copyDiagnostics">검사 결과 복사</button><button id="downloadDiagnostics">검사 결과 TXT 저장</button><pre id="diagnostics" style="white-space:pre-wrap;overflow-wrap:anywhere;color:#d5e4ff"></pre></section>
</main><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');
let uploadedImage=null;async function loadPhoto(file){if(!file){uploadedImage=null;draw();return}if(!file.type.startsWith('image/')){$('status').textContent='이미지 파일을 선택하세요.';return}const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});uploadedImage=img;draw()}catch(e){$('status').textContent='사진을 열 수 없습니다.'}finally{URL.revokeObjectURL(url)}}function draw(){const [w,h]=$('size').value.split('x').map(Number);c.width=w;c.height=h;const theme=$('theme').value;const palettes={galaxy:['#090b2b','#432b7e','#ad78dd'],sunset:['#2b205c','#df6580','#ffd18d'],forest:['#092f2d','#27705d','#b2d6a2'],ocean:['#061d48','#1474a2','#8de1e8']};const colors=palettes[theme];let grad=ctx.createLinearGradient(0,0,w,h);colors.forEach((color,i)=>grad.addColorStop(i/(colors.length-1),color));ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);if(uploadedImage){const iw=uploadedImage.naturalWidth,ih=uploadedImage.naturalHeight,scale=Math.max(w/iw,h/ih),sw=w/scale,sh=h/scale;ctx.drawImage(uploadedImage,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,w,h);const over=$('overlay').value;if(over!=='none'){ctx.fillStyle=over==='purple'?'rgba(112,56,175,.22)':'rgba(60,174,240,.2)';ctx.fillRect(0,0,w,h)}}let seed=123456;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let i=0;i<(uploadedImage?0:280);i++){const x=rnd()*w,y=rnd()*h,r=(.4+rnd()*2.8)*w/1080;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(.08+rnd()*.65)+')';ctx.fill()}$('status').textContent='무료 그래픽 배경화면 생성 완료 ('+w+'×'+h+')';}
function suggestTheme(){const t=$('prompt').value;let match=null;if(/호수|바다|물결|파도|강|해변/.test(t))match='ocean';else if(/새벽|아침|노을|일출|일몰|태양/.test(t))match='sunset';else if(/숲|나무|산|초록/.test(t))match='forest';else if(/별|우주|은하|달|밤하늘/.test(t))match='galaxy';if(match){$('theme').value=match;$('recommendation').textContent='입력한 단어를 바탕으로 색상 스타일을 자동 선택했습니다. 실제 AI 그림 생성은 아닙니다.'}else{$('recommendation').textContent='선택한 스타일로 추상 배경을 제작합니다.'}}$('make').onclick=()=>{suggestTheme();draw()};$('photo').onchange=e=>loadPhoto(e.target.files[0]);$('overlay').onchange=draw;$('size').onchange=draw;$('theme').onchange=draw;
$('saveJpg').onclick=()=>{const a=document.createElement('a');a.download='wallpaper-'+Date.now()+'.jpg';a.href=c.toDataURL('image/jpeg',.94);a.click()};$('save').onclick=()=>{const a=document.createElement('a');a.download='wallpaper-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click()};
$('gpu').onclick=async()=>{if(!navigator.gpu){$('gpuStatus').textContent='이 브라우저는 WebGPU를 지원하지 않습니다.';return}try{const adapter=await navigator.gpu.requestAdapter();$('gpuStatus').textContent=adapter?'WebGPU 사용 가능 (AI 모델 탑재 및 성능 검증은 별도 필요)':'WebGPU 어댑터를 사용할 수 없습니다.'}catch(e){$('gpuStatus').textContent='WebGPU 확인 실패: '+e.message}};
$('diagnose').onclick=async()=>{const lines=[];lines.push('브라우저: '+navigator.userAgent);lines.push('논리 프로세서: '+(navigator.hardwareConcurrency||'정보 없음'));lines.push('기기 메모리(추정): '+(navigator.deviceMemory?navigator.deviceMemory+'GB':'정보 없음'));lines.push('보안 연결: '+(isSecureContext?'예':'아니오'));if(!navigator.gpu){lines.push('WebGPU: 미지원');}else{try{const a=await navigator.gpu.requestAdapter();if(!a){lines.push('WebGPU: 어댑터 없음')}else{lines.push('WebGPU: 어댑터 사용 가능');lines.push('최대 저장 버퍼: '+Math.round(a.limits.maxStorageBufferBindingSize/1048576)+'MiB');lines.push('shader-f16: '+(a.features.has('shader-f16')?'지원':'미지원'));}}catch(e){lines.push('WebGPU 오류: '+e.message)}}lines.push('※ AI 이미지 생성 성공을 보장하는 검사가 아닙니다.');$('diagnostics').textContent=lines.join('\n')};$('copyDiagnostics').onclick=async()=>{const v=$('diagnostics').textContent;if(!v){$('gpuStatus').textContent='먼저 기기 AI 실행 적합성 검사를 실행하세요.';return}try{await navigator.clipboard.writeText(v);$('gpuStatus').textContent='검사 결과를 복사했습니다.'}catch(e){$('gpuStatus').textContent='복사할 수 없습니다. 아래 검사 결과를 길게 눌러 복사하세요.'}};
$('downloadDiagnostics').onclick=()=>{const v=$('diagnostics').textContent;if(!v){$('gpuStatus').textContent='먼저 기기 AI 실행 적합성 검사를 실행하세요.';return}const blob=new Blob([v],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='wallpaper-device-check.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('computeTest').onclick=async()=>{const b=$('computeTest'),out=$('computeResult');b.disabled=true;out.textContent='GPU 연산 테스트 실행 중…';let device;try{if(!navigator.gpu)throw Error('WebGPU 미지원');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('GPU 어댑터 없음');device=await adapter.requestDevice();const shader=device.createShaderModule({code:'@group(0) @binding(0) var<storage, read_write> data: array<f32>; @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3<u32>) { if (id.x < 1024u) { data[id.x] = f32(id.x) * 2.0 + 1.0; } }'});const pipeline=device.createComputePipeline({layout:'auto',compute:{module:shader,entryPoint:'main'}});const buffer=device.createBuffer({size:4096,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});const read=device.createBuffer({size:4096,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer}}]});const encoder=device.createCommandEncoder(),pass=encoder.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,group);pass.dispatchWorkgroups(16);pass.end();encoder.copyBufferToBuffer(buffer,0,read,0,4096);const start=performance.now();device.queue.submit([encoder.finish()]);await read.mapAsync(GPUMapMode.READ);const result=new Float32Array(read.getMappedRange());const ok=result[0]===1&&result[100]===201&&result[1023]===2047;const ms=Math.round(performance.now()-start);out.textContent=ok?'GPU 연산 성공 ('+ms+'ms). AI 모델 실행 성공을 뜻하지는 않습니다.':'GPU 연산 결과 검증 실패';read.unmap();buffer.destroy();read.destroy()}catch(e){out.textContent='GPU 연산 실패: '+(e?.message||String(e))}finally{device?.destroy();b.disabled=false}};$('memoryTest').onclick=async()=>{const button=$('memoryTest'),out=$('memoryResult');button.disabled=true;out.textContent='16MiB GPU 연산 및 읽기 테스트 중…';let device,storage,read;const started=performance.now();try{if(!navigator.gpu)throw Error('WebGPU 미지원');const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('어댑터 없음');device=await adapter.requestDevice();const count=4194304,bytes=count*4;const shader=device.createShaderModule({code:'@group(0) @binding(0) var<storage, read_write> a: array<f32>; @compute @workgroup_size(256) fn main(@builtin(global_invocation_id) id: vec3<u32>) { if(id.x < 4194304u){a[id.x]=f32(id.x % 1024u)*0.5;}}'});const pipeline=device.createComputePipeline({layout:'auto',compute:{module:shader,entryPoint:'main'}});storage=device.createBuffer({size:bytes,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});read=device.createBuffer({size:bytes,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});const bind=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:storage}}]});const enc=device.createCommandEncoder(),pass=enc.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,bind);pass.dispatchWorkgroups(Math.ceil(count/256));pass.end();enc.copyBufferToBuffer(storage,0,read,0,bytes);device.queue.submit([enc.finish()]);await read.mapAsync(GPUMapMode.READ);const a=new Float32Array(read.getMappedRange());const valid=a[0]===0&&a[3]===1.5&&a[1023]===511.5&&a[1024]===0&&a[count-1]===511.5;out.textContent=valid?'16MiB GPU 메모리·연산 검사 성공 ('+Math.round(performance.now()-started)+'ms). 이미지 생성 모델 실행을 보장하지 않습니다.':'검증 실패: GPU 계산값 불일치';read.unmap()}catch(e){out.textContent='GPU 부하 검사 실패: '+(e?.message||String(e))}finally{try{storage?.destroy();read?.destroy();device?.destroy()}catch(e){}button.disabled=false}};draw();
</script></body></html>
